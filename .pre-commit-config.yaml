# .pre-commit-config.yaml
fail_fast: true
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.11
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
        pass_filenames: false
        stages: [pre-commit] # Run before commit
        always_run: true
      # Run the formatter.
      - id: ruff-format
        pass_filenames: false
        stages: [pre-commit] # Run before commit
        always_run: true
